name: Agda proofs

# Recipe: the prover is Debian's agda package at the exact version the hosted
# receipt in PROOF-STATUS.adoc cites, inside a digest-pinned image, and the
# compared siblings are fetched by commit with plain git. No third-party action
# is used. This repository's Actions posture is `selected`; the previous
# recipe's wenkokke/setup-agda was refused before any job started
# (startup_failure, jobs=0, every run since 2026-09-19). The only action below
# is GitHub-owned.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    name: Core proofs, expected rejections and sibling comparisons
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: debian:13-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
    steps:
      - name: Install authenticated Debian toolchain packages
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git curl unzip agda-bin=2.6.4.3-1+b2
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - name: Verify the checked Agda version
        run: test "$(agda --version)" = 'Agda version 2.6.4.3'
      - name: Core proofs and expected rejections
        run: bash scripts/check.sh
      - name: Fetch the compared sibling revisions by commit
        run: bash scripts/fetch-siblings.sh
      - name: Compare with the actual sibling interfaces
        run: |
          agda --safe --without-K --no-libraries --ignore-interfaces --double-check -i src -i tests/integration -i _build/dependencies/epistemic-types/src tests/integration/EpistemicComparison.agda
          agda --safe --without-K --no-libraries --ignore-interfaces --double-check -i src -i tests/integration -i _build/dependencies/echo-types/proofs/agda -i _build/dependencies/standard-library/src tests/integration/EchoComparison.agda
      # bun is installed from a pinned upstream release and verified against two
      # digests before it is run: the SHA-256 published in the release's
      # SHASUMS256.txt, and a SHA-512 recorded here when the pin was taken.
      # No third-party action, no `curl | sh`.
      - name: Install pinned bun by checksum
        env:
          BUN_VERSION: 1.3.14
          BUN_SHA256: 951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f
          BUN_SHA512: 31f054acf7341023d8d21d935faa4c4608c8efbbde8e3a8a4c344dd8b78e438b84b8f377318ac03b4b3c7d0fa4ff387e2864c87e5f704e2ed0e47dda38c35995
        run: |
          zip="$RUNNER_TEMP/bun-linux-x64.zip"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  ${zip}" | sha256sum -c -
          echo "${BUN_SHA512}  ${zip}" | sha512sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/bun"
          install -m 0755 "$RUNNER_TEMP/bun/bun-linux-x64/bun" /usr/local/bin/bun
          test "$(bun --version)" = "${BUN_VERSION}"
      - name: Explorer correspondence (harness, table drift, refl)
        run: bash scripts/correspondence.sh

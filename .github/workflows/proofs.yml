name: Agda proofs

# Recipe: the prover is Debian's agda package at the exact version the hosted
# receipt in PROOF-STATUS.adoc cites, inside a digest-pinned image, and the
# compared siblings are fetched by commit with plain git. No third-party action
# is used. This repository's Actions posture is `selected`; the previous
# recipe's wenkokke/setup-agda was refused before any job started
# (startup_failure, jobs=0, every run since 2026-09-19). The only action below
# is GitHub-owned.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    name: Core proofs, expected rejections and sibling comparisons
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: debian:13-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
    steps:
      - name: Install authenticated Debian toolchain packages
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git agda-bin=2.6.4.3-1+b2
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - name: "CONTROL, do not merge: third-party action under an empty allow-list"
        uses: wenkokke/setup-agda@v2.5.0
        with:
          agda-version: "2.6.4.3"
      - name: Verify the checked Agda version
        run: test "$(agda --version)" = 'Agda version 2.6.4.3'
      - name: Core proofs and expected rejections
        run: bash scripts/check.sh
      - name: Fetch the compared sibling revisions by commit
        run: bash scripts/fetch-siblings.sh
      - name: Compare with the actual sibling interfaces
        run: |
          agda --safe --without-K --no-libraries --ignore-interfaces --double-check -i src -i tests/integration -i _build/dependencies/epistemic-types/src tests/integration/EpistemicComparison.agda
          agda --safe --without-K --no-libraries --ignore-interfaces --double-check -i src -i tests/integration -i _build/dependencies/echo-types/proofs/agda -i _build/dependencies/standard-library/src tests/integration/EchoComparison.agda

# SPDX-License-Identifier: MPL-2.0
# Prevention workflow - scans for hardcoded secrets before they reach main.
#
# Calls the estate's bounded shared secret scanner (gitleaks plus
# receipt-verified rust-secrets and shell-secrets). The job key MUST stay
# `scan`: the estate-wide Secret-Scan-Floor ruleset requires `scan / gitleaks`.
# The canonical suite coordinate is admitted by the reusable's exact-source
# resolver and avoids the old renamed-standards startup rejection.
#
# No `secrets:` line, deliberately: the reusable references no secrets
# (gitleaks runs as a checksum-verified binary, not gitleaks-action), so
# `secrets: inherit` would only hand it every repo and org secret (CWE-250).
name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/secret-scanner-reusable.yml@1fd5e6371a50f0fc3687206a5adca0cdf7b39aa6
    with:
      # Full history remains the default for both pushes and pull requests.
      fast-pr: false
